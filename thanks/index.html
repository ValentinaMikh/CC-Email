<style>
:root{
  --primary:#80BA27;--orange:#F8A42A;--main-text:#1E1E1E;--sub-1:#4F4F4F;--sub-2:#808080;--sub-3:#BCBCBC;
  --bg:#FFFFFF;--bg-sub:#F7F7F7;--border:#E5E5E5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--main-text)}
body{font-family:Ubuntu,Arial,Helvetica,sans-serif;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
svg{display:block;flex:none}

/* Header */
.header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--border);padding:4px 0 8px}
.headline{display:flex;flex-direction:column;gap:8px;padding:0 48px;max-width:1440px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;overflow:hidden}
.topbar-group{display:flex;align-items:center;gap:24px;padding:8px;border-radius:8px;height:36px}
.ti{display:flex;align-items:center;gap:8px;font-size:14px;line-height:1;color:var(--sub-1);white-space:nowrap}
.ti .mode{display:flex;align-items:center;gap:4px;color:var(--primary);font-weight:500}
.ti.muted{color:var(--sub-2)}
.brandbar{display:flex;justify-content:center;padding:0 12px 8px}
.brandbar img{display:block;width:254px;height:36px}
.navrow{display:flex;gap:8px;align-items:flex-start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:16px 24px;border-radius:8px;font:500 16px/1 Ubuntu,Arial,sans-serif;white-space:nowrap;border:0;cursor:pointer}
.btn-green{background:var(--primary);color:#fff}
.btn-orange{background:var(--orange);color:#fff}
.btn-ghost{background:var(--bg);color:var(--sub-2)}
.btn-icon{width:46px;padding:16px}
.search{flex:1 1 0;min-width:0;height:46px;display:flex;align-items:center;gap:8px;padding:16px;border-radius:8px;background:var(--bg-sub)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:400 16px/1 Ubuntu,Arial,sans-serif;color:var(--main-text)}
.search input::placeholder{color:var(--sub-3)}

/* Content */
.content{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 49px}
.box{display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px 0;text-align:center}
.capibara{display:block;width:240px;height:240px}
.textbox{display:flex;flex-direction:column;align-items:center;gap:40px}
.titlebox{display:flex;flex-direction:column;align-items:center;gap:16px}
h1{margin:0;font:500 36px/44px Ubuntu,Arial,sans-serif;color:var(--main-text)}
.sub{margin:0;font:400 18px/1.3 Arial,Helvetica,sans-serif;color:var(--sub-1)}
.actions{display:flex;gap:16px}
.actions .btn{width:164px}
.btn-link{background:transparent;color:var(--primary)}
.btn:focus-visible,.search:focus-within{outline:2px solid var(--primary);outline-offset:2px}

@media (max-width:1100px){
  .headline{padding:0 24px}
  .hide-lg{display:none!important}
}
@media (max-width:768px){
  .topbar .topbar-group.contacts{display:none}
  .btn .lbl{display:none}
  .btn-nav{width:46px;padding:16px}
  .search{display:none}
  .navrow{justify-content:space-between}
  .navrow .spacer{flex:1}
  .content{padding:24px 16px}
}
@media (max-width:480px){
  .headline{padding:0 16px}
  .topbar-group{padding:8px 0}
  .capibara{width:180px;height:180px}
  h1{font-size:28px;line-height:34px}
  .sub{font-size:16px}
  .actions{flex-direction:column;width:100%;max-width:320px}
  .actions .btn{width:100%}
}
</style>
</head>
